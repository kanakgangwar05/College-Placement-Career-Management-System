<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPO Analytics Hub</title>
  <link rel="stylesheet" href="../CSS/style.css" />
</head>
<body>

  <header class="topbar">
    <h1>TPO Analytics Hub</h1>
  </header>

  <main class="dashboard-container">

    <!-- Quick stats row -->
    <section class="stats-row">
      <div class="stat-card">
        <h3>Placement %</h3>
        <p>82%</p>
      </div>
      <div class="stat-card">
        <h3>Highest Package</h3>
        <p>₹42 LPA</p>
      </div>
      <div class="stat-card">
        <h3>Average Package</h3>
        <p>₹8.5 LPA</p>
      </div>
    </section>

    <!-- Charts row: static placeholders for now -->
    <section class="charts-row">
      <div class="chart-box">
        <h3>Department-wise Placement</h3>
        <div class="chart-placeholder">
          <p>[ Bar Chart: CSE vs ECE vs ME ]</p>
        </div>
      </div>

      <div class="chart-box">
        <h3>Year-on-Year Hiring Trend</h3>
        <div class="chart-placeholder">
          <p>[ Line Chart: 2022 – 2026 Hiring Trend ]</p>
        </div>
      </div>
    </section>

  </main>

</body>
</html>
