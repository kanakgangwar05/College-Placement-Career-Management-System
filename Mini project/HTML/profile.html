<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - GLA Campus Portal</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <div class="home-logo">
            🎓 GLA Campus Portal
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="jobs.html">Jobs</a>
            <a href="#">Applications</a>
            <a href="profile.html">Profile</a>
        </nav>

        <a href="login.html" class="logout-button">
            Logout
        </a>

    </header>


    <!-- Profile Page -->
    <main class="dashboard">

        <!-- Page Heading -->
        <section class="welcome-section">

            <div>
                <p>Student Portal</p>

                <h1>My Profile</h1>

                <span>
                    Manage your personal and academic information.
                </span>
            </div>

        </section>


        <!-- Personal Information -->
        <section class="dashboard-section">

            <h2>Personal Information</h2>

            <div class="m2-profile-grid">

                <div class="m2-profile-field">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name">
                </div>

                <div class="m2-profile-field">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email">
                </div>

                <div class="m2-profile-field">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter your phone number">
                </div>

                <div class="m2-profile-field">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>

            </div>

        </section>


        <!-- Academic Information -->
        <section class="dashboard-section">

            <h2>Academic Information</h2>

            <div class="m2-profile-grid">

                <div class="m2-profile-field">
                    <label>10th Percentage</label>
                    <input type="number" placeholder="Enter percentage">
                </div>

                <div class="m2-profile-field">
                    <label>12th Percentage</label>
                    <input type="number" placeholder="Enter percentage">
                </div>

                <div class="m2-profile-field">
                    <label>B.Tech CGPA</label>
                    <input type="number" step="0.01" placeholder="Enter CGPA">
                </div>

                <div class="m2-profile-field">
                    <label>Backlogs</label>
                    <input type="number" placeholder="Enter number of backlogs">
                </div>

            </div>

        </section>


        <!-- Skills -->
        <section class="dashboard-section">

            <h2>Skills & Resume</h2>

            <div class="m2-profile-grid">

                <div class="m2-profile-field">

                    <label>Technical Skills</label>

                    <textarea
                        rows="4"
                        placeholder="Example: Java, Python, DSA, HTML, CSS">
                    </textarea>

                </div>


                <div class="m2-profile-field">

                    <label>Resume</label>

                    <input type="file">

                    <p class="m2-profile-note">
                        Upload your latest resume in PDF format.
                    </p>

                </div>

            </div>

        </section>


        <!-- Save Button -->
        <section class="m2-profile-save">

            <button type="button">
                Save Profile
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <div>
            🎓 <strong>GLA Campus Portal</strong>
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="#">Help</a>
            <a href="#">Contact</a>
        </div>

    </footer>

</body>

</html>
