<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Portal - Login</title>

    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">
            <div class="logo">
                <span>GLA Campus Portal</span>
            </div>
            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to your account</p>
            <div class="role-section">

                <p>Select Role</p>

                <div class="roles">

                    <label>
                        <input type="radio" name="role" checked>
                        Student
                    </label>

                    <label>
                        <input type="radio" name="role">
                        TPO
                    </label>

                    <label>
                        <input type="radio" name="role">
                        Recruiter
                    </label>

                </div>

            </div>
            <form>

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
                <div class="remember">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>

                </div>

                <a href="student-dashboard.html" class="login-submit">
    Login
</a> 
<a href="tpo-dashboard.html" class="login-submit">
     Login
</a> -->
<a href="student-dashboard.html" class="login-submit">
    Login
</a>
<div class="dashboard-demo">

    <p>Demo Login:</p>

    <a href="student-dashboard.html">Student Dashboard</a>

    <a href="recruiter-dashboard.html">Recruiter Dashboard</a>

</div>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </div>

    </main>

</body>

</html>
